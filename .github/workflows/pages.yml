name: Publish SMT assistant

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smt-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test exporter
        run: python3 -m unittest discover -s tests -v
      - name: Package committed public snapshot
        run: >-
          python3 scripts/export_site.py --snapshot
          --ref "$GITHUB_SHA"
          --output "$RUNNER_TEMP/smt-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/smt-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
